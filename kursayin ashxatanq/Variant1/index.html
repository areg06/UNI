<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Կուրսային աշխատանք, տարբերակ 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400..700&display=swap">
<style>
:root{--bg:#fafafa;--card:#fff;--fg:#1d1d1f;--muted:#666;--line:#e3e3e3;--accent:#0b5fff}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1e1e21;--fg:#eee;--muted:#a0a0a8;--line:#333;--accent:#6b9bff}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);
  font:16px/1.5 "Noto Sans Armenian",system-ui,sans-serif;padding:24px 16px}
main{width:100%;max-width:640px}
h1{font-size:1.6rem;margin:0 0 4px}
p.sub{margin:0 0 28px;color:var(--muted)}
.choices{display:grid;gap:16px;grid-template-columns:1fr 1fr}
@media (max-width:520px){.choices{grid-template-columns:1fr}}
a.card{display:block;padding:22px 20px;border:1px solid var(--line);border-radius:14px;background:var(--card);
  color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
a.card:hover,a.card:focus-visible{border-color:var(--accent);transform:translateY(-2px);outline:none}
.card b{display:block;font-size:1.15rem;margin-bottom:6px;color:var(--accent)}
.card span{color:var(--muted);font-size:.95rem}
</style>
</head>
<body>
<main>
<h1>Կուրսային աշխատանք</h1>
<p class="sub">ՄՄՏ, առաջադրանք 2, տարբերակ 1</p>
<div class="choices">
  <a class="card" href="TMM_Variant1.html"><b>Աշխատանքը</b><span>Սինթեզ, արագությունների և արագացումների պլաններ, A3 գծագրեր, տետրի էջերը</span></a>
  <a class="card" href="bacatrutyun.html"><b>Բացատրություն</b><span>Քայլ առ քայլ բացատրություն՝ ինչ և ինչու է արվում</span></a>
</div>
</main>
</body>
</html>
