<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<title>Ջերմադինամիկա և ջերմափոխանցում</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Armenian:wght@400;700&family=Noto+Sans+Armenian:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body,{delimiters:[{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}],throwOnError:false});"></script>
<style>
  @page { size: A4; margin: 20mm 18mm 20mm 20mm; }
  :root { --ink:#1a1a1a; --muted:#555; --accent:#1f3a68; --rule:#c9ced8; --soft:#f3f5f9; }
  html { background:#fff; }
  body { font-family:'Noto Serif Armenian','Mshtakan',serif; font-size:11.5pt; line-height:1.55; color:var(--ink); background:#fff; margin:0 auto; max-width:180mm; padding:0 16px; }
  h1,h2,h3,h4 { font-family:'Noto Sans Armenian','Arial',sans-serif; color:var(--accent); line-height:1.3; break-after:avoid; }
  h1 { font-size:17pt; text-align:center; margin:0 0 6mm; padding-top:4mm; break-before:page; }
  h2 { font-size:13.5pt; text-align:center; margin:8mm 0 4mm; }
  h3 { font-size:12pt; text-align:center; margin:6mm 0 3mm; }
  h4 { font-size:11.5pt; margin:4mm 0 2mm; }
  p { text-align:justify; text-indent:1.25em; margin:0 0 2.2mm; hyphens:auto; }
  p.ni { text-indent:0; }
  .eq { display:flex; align-items:center; margin:2mm 0; break-inside:avoid; }
  .eq .m { flex:1; text-align:center; }
  .eq .n { min-width:16mm; text-align:right; font-family:'Noto Sans Armenian',sans-serif; font-size:10pt; }
  figure { margin:4mm auto; text-align:center; break-inside:avoid; }
  figure img { max-width:100%; max-height:95mm; }
  figcaption { font-family:'Noto Sans Armenian',sans-serif; font-size:10pt; font-weight:700; margin-top:1mm; }
  ul,ol { margin:1mm 0 2.5mm 6mm; padding-left:4mm; }
  li { margin-bottom:1mm; text-align:justify; }
  table { border-collapse:collapse; margin:3mm auto; font-size:10pt; break-inside:auto; }
  th,td { border:1px solid var(--rule); padding:1.2mm 2.2mm; vertical-align:top; }
  th { background:var(--soft); font-family:'Noto Sans Armenian',sans-serif; }
  .note { font-size:9.5pt; color:var(--muted); }
  .term { font-size:9pt; color:var(--muted); }
  .title-page { text-align:center; padding-top:30mm; }
  .title-page .org { font-family:'Noto Sans Armenian',sans-serif; font-size:11pt; }
  .title-page .author { margin-top:28mm; font-size:13pt; }
  .title-page .main { margin-top:22mm; font-family:'Noto Sans Armenian',sans-serif; font-size:24pt; color:var(--accent); font-weight:700; }
  .title-page .sub { margin-top:4mm; font-size:14pt; }
  .title-page .bottom { margin-top:80mm; font-size:11pt; }
  .gloss { width:100%; font-size:9.5pt; }
  .gloss td:first-child { width:36%; } .gloss td:nth-child(2) { width:38%; font-weight:700; } .gloss td:nth-child(3){ color:var(--muted); }
  .gloss tr.sec td { background:var(--soft); font-family:'Noto Sans Armenian',sans-serif; font-weight:700; color:var(--accent); text-align:left; }
  .toc { list-style:none; padding:0; margin:0; } .toc li { margin:1.5mm 0; text-align:left; } .toc .s { font-weight:700; margin-top:3mm; }
  .pb { break-before:page; }
</style>
</head>
<body>
<!--BODY-->
</body>
</html>
