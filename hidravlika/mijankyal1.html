<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Հիդրավլիկա · առաջին միջանկյալ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400..700&display=swap">
<style>
:root{--bg:#f6f7f7;--card:#fff;--fg:#1b2127;--muted:#5d6870;--line:#dde2e4;--accent:#2a4c9c}
@media (prefers-color-scheme:dark){:root{--bg:#121619;--card:#1a2025;--fg:#e6eaec;--muted:#98a4ac;--line:#2c363c;--accent:#8fa9f2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Noto Sans Armenian",system-ui,sans-serif;padding:40px 16px}
main{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1{font-size:1.7rem;margin:0}
.back{color:var(--muted);font-size:.95rem}
.panel{padding:18px 20px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--muted)}
</style>
</head>
<body>
<main>
<a class="back" href="./">← Հիդրավլիկա</a>
<h1>Առաջին միջանկյալ</h1>
<div class="panel">Նյութը դեռ ավելացված չէ։ Հարցերը և դասախոսությունները կհայտնվեն այստեղ։</div>
</main>
</body>
</html>
