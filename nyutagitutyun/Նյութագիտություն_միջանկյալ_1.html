<!doctype html>
<html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Նյութագիտություն · Միջանկյալ 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;500;600;700&family=Noto+Serif+Armenian:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: lab-notebook study app. Left rail of sections, one working column; figures sit on printed "plates". */
:root{
  --bg:#EDF0F0; --surface:#FAFBFB; --sunk:#E3E8E9; --ink:#162027; --muted:#56636C; --line:#CDD5D8;
  --accent:#2A4C9C; --accent-ink:#FFFFFF; --accent-soft:#DCE4F5; --heat:#B4530F; --heat-soft:#F6E2D2;
  --good:#2C7A4B; --good-soft:#D9EEDF; --warn:#A86A12; --warn-soft:#F5E8CF; --bad:#B0302A; --bad-soft:#F6DAD8;
  --plate:#F8F8F5; --plate-ink:#1E1E1E;
  --f-display:"Noto Serif Armenian","Mshtakan",Georgia,serif;
  --f-body:"Noto Sans Armenian","Arial","Helvetica Neue",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161A; --surface:#182026; --sunk:#0D1215; --ink:#E3E8EB; --muted:#93A1AA; --line:#2A353C;
  --accent:#8FA9F2; --accent-ink:#0E1630; --accent-soft:#1F2A46; --heat:#F0A060; --heat-soft:#3A2618;
  --good:#6CC98F; --good-soft:#18301F; --warn:#E3B45B; --warn-soft:#352914; --bad:#F08A82; --bad-soft:#3A1A18;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161A; --surface:#182026; --sunk:#0D1215; --ink:#E3E8EB; --muted:#93A1AA; --line:#2A353C;
  --accent:#8FA9F2; --accent-ink:#0E1630; --accent-soft:#1F2A46; --heat:#F0A060; --heat-soft:#3A2618;
  --good:#6CC98F; --good-soft:#18301F; --warn:#E3B45B; --warn-soft:#352914; --bad:#F08A82; --bad-soft:#3A1A18;
  color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.25;text-wrap:balance;margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;padding:24px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand b{font-family:var(--f-display);font-size:20px;letter-spacing:.01em}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500;font-size:15px}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px;display:flex;flex-direction:column;gap:8px}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:12px;text-align:left}

main{padding-block:32px 64px;padding-inline:40px;min-width:0}
.view{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.view-head{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.view-head h1{font-size:30px;font-weight:700}
.lede{color:var(--muted);max-width:62ch}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:8px;font-weight:600;font-size:15px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
select,input[type="text"],input[type="search"],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{width:100%;min-height:150px;resize:vertical;line-height:1.55}

/* Home */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-mono);font-size:26px;font-weight:500}
.stat span{font-size:13px;color:var(--muted)}
.topics{display:flex;flex-direction:column}
.topic{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.topic:last-child{border-bottom:0}
.topic h3{font-size:16px;font-family:var(--f-body);font-weight:600}
.topic p{font-size:13px;color:var(--muted);margin:2px 0 0}
.segbar{display:flex;gap:3px}
.segbar i{flex:1;height:10px;border-radius:3px;background:var(--sunk);border:1px solid var(--line)}
.segbar i.r1{background:var(--bad);border-color:var(--bad)}
.segbar i.r2{background:var(--warn);border-color:var(--warn)}
.segbar i.r3{background:var(--good);border-color:var(--good)}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;counter-reset:s}
.step{border-top:3px solid var(--accent);padding-top:10px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.step b{font-size:15px}
.step a{font-size:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Lectures */
.lec-tabs{display:flex;gap:6px;flex-wrap:wrap}
.lec-tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;display:flex;gap:6px;align-items:center}
.lec-tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lec-tabs .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
.reader{display:flex;flex-direction:column;gap:30px}
.reader-head{display:flex;flex-direction:column;gap:8px;padding-bottom:18px;border-bottom:2px solid var(--ink)}
.reader-head h2{font-size:28px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);letter-spacing:.02em}
.toc{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px}
.sec{display:flex;flex-direction:column;gap:12px;scroll-margin-top:20px}
.sec h3{font-size:21px;display:flex;gap:10px;align-items:baseline}
.sec h3 .n{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-weight:400}
.sec h4{font-size:17px;margin-top:6px}
.prose{max-width:68ch}
.prose p,.prose ul,.prose ol,.prose dl{margin:0 0 10px}
.prose ul,.prose ol{padding-left:22px}
.prose li{margin:3px 0}
.prose dt{font-weight:700;margin-top:12px;font-family:var(--f-display);font-size:16.5px}
.prose dd{margin:2px 0 0 0;padding-left:14px;border-left:2px solid var(--line)}
.key{background:var(--accent-soft);border-radius:8px;padding:12px 14px;margin:6px 0 10px}
.formula{font-family:var(--f-mono);background:var(--sunk);border-radius:6px;padding:8px 12px;margin:8px 0;font-size:14.5px;overflow-x:auto}
.formula.big{font-size:20px;text-align:center;padding:14px}
.sup{color:inherit}
.sup-on .sup{background:linear-gradient(transparent 0, transparent),var(--heat-soft);box-decoration-break:clone;-webkit-box-decoration-break:clone;border-radius:3px;padding:0 2px}
div.sup,p.sup{display:block}
.sup-on div.sup,.sup-on p.sup{padding:8px 12px;border-left:3px solid var(--heat)}
.note{font-size:13.5px;color:var(--muted);font-style:italic}
.tbl-wrap{overflow-x:auto;max-width:100%}
.tbl{border-collapse:collapse;font-size:14px;width:100%;margin:6px 0 12px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:2px solid var(--ink);padding:6px 10px 6px 0}
.tbl td{border-bottom:1px solid var(--line);padding:8px 10px 8px 0;vertical-align:top}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 12px}
.cmp>div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.cmp h5{margin:0 0 6px;font-family:var(--f-display);font-size:16px}
.cmp p,.cmp ul{margin:0}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
figure{margin:0;display:flex;flex-direction:column;gap:6px}
.plate{background:var(--plate);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
.plate img{max-height:240px;width:auto;mix-blend-mode:multiply}
figcaption{font-size:13px;color:var(--muted);line-height:1.45}
figcaption b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.reader-foot{display:flex;gap:10px;flex-wrap:wrap;padding-top:18px;border-top:1px solid var(--line)}
.lb{position:fixed;inset:0;background:rgba(10,14,16,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;z-index:50}
.lb img{max-width:min(1100px,100%);max-height:80vh;background:#F8F8F5;padding:12px;border-radius:6px}
.lb p{color:#E8ECEE;max-width:70ch;text-align:center;margin:0}
.search-hits{display:flex;flex-direction:column;gap:6px}
.hit{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:left;font-size:14px}
.hit b{display:block;font-size:13px;color:var(--muted);font-weight:600}
mark{background:var(--heat-soft);color:inherit;border-radius:2px}

/* Questions */
.qgroup{display:flex;flex-direction:column;gap:10px}
.qgroup>h2{font-size:19px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.q-head{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px 16px;width:100%;background:none;border:0;text-align:left}
.q-id{font-family:var(--f-mono);font-size:14px;color:var(--muted);padding-top:1px}
.q-text{font-weight:600;font-size:15.5px}
.badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge.r0{background:var(--sunk);color:var(--muted)}
.badge.r1{background:var(--bad-soft);color:var(--bad)}
.badge.r2{background:var(--warn-soft);color:var(--warn)}
.badge.r3{background:var(--good-soft);color:var(--good)}
.q-body{padding:0 16px 16px 80px;display:flex;flex-direction:column;gap:12px}
.recall{border:1px dashed var(--line);border-radius:8px;padding:12px 14px;color:var(--muted);font-size:14px}
.answer{border-left:3px solid var(--accent);padding-left:14px}
.rate{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:14px;font-weight:600}
.rate button[data-r="1"][aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.rate button[data-r="2"][aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.rate button[data-r="3"][aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Study / check modes */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--sunk);padding:5px;border-radius:12px}
.modes button{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;border:0;background:none;border-radius:8px;padding:10px 14px}
.modes button span{font-size:13px;color:var(--muted)}
.modes button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.modes button[aria-selected="true"] b{color:var(--accent)}

/* Writing practice */
.tip ol{margin:6px 0 0;padding-left:20px;font-size:14.5px}
.checklist{display:flex;flex-direction:column;gap:6px;background:var(--sunk);border-radius:8px;padding:12px 14px}
.cl-item{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;font-size:14.5px;cursor:pointer}
.cl-item input{margin-top:5px;accent-color:var(--good)}
.cl-item:has(input:checked) span{color:var(--muted)}
details.full{border:1px solid var(--line);border-radius:8px}
details.full>summary{cursor:pointer;padding:10px 14px;font-weight:600;color:var(--accent)}
.full-in{padding:4px 14px 16px;display:flex;flex-direction:column;gap:18px}
.full-in .sec h3{font-size:18px}

/* Flashcards */
.deck{display:flex;flex-direction:column;align-items:center;gap:16px}
.card{width:100%;max-width:620px;min-height:260px;perspective:1400px;background:none;border:0;padding:0}
.card-in{position:relative;width:100%;min-height:260px;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card.flipped .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:28px;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--accent-soft)}
.face .term{font-family:var(--f-display);font-size:26px;font-weight:700}
.face .def{font-size:18px;max-width:46ch}
.face small{position:absolute;top:14px;left:18px;font-size:12px;color:var(--muted);letter-spacing:.05em}
.face .hint{position:absolute;bottom:12px;font-size:12px;color:var(--muted)}
.deck-ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.progress{width:100%;max-width:620px;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}

/* Quiz */
.qz-opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 14px;font-size:15.5px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);color:var(--muted)}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.explain{font-size:14.5px;padding:10px 14px;border-radius:8px;background:var(--sunk)}
.qz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.qz-q{font-size:20px;font-family:var(--f-display);font-weight:600}
.score{font-family:var(--f-mono);font-size:56px;line-height:1}
.mist{display:flex;flex-direction:column;gap:10px}
.mist>div{border-left:3px solid var(--bad);padding-left:12px;font-size:14.5px}
.hist{display:flex;gap:6px;align-items:flex-end;height:60px}
.hist i{width:22px;background:var(--accent);border-radius:3px 3px 0 0;opacity:.85}

/* Exam */
.timer{font-family:var(--f-mono);font-size:22px}
.timer.low{color:var(--bad)}
.ticket{display:flex;flex-direction:column;gap:10px;padding:18px 0;border-bottom:1px solid var(--line)}
.ticket h3{font-family:var(--f-body);font-size:16.5px;font-weight:600}
.ticket .q-id{font-size:13px}

/* Diagram */
.dg-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.dg{display:block;width:100%;min-width:620px;height:auto;cursor:crosshair;touch-action:manipulation}
.dg .reg{fill:transparent;stroke:none}
.dg .reg:hover{fill:var(--accent-soft)}
.dg .reg.on{fill:var(--heat-soft)}
.dg .ln{stroke:var(--ink);stroke-width:1.8;fill:none}
.dg .ln.thin{stroke-width:1;stroke-dasharray:4 4;stroke:var(--muted)}
.dg .grid{stroke:var(--line);stroke-width:1}
.dg text{fill:var(--ink);font-family:var(--f-body);font-size:13px}
.dg .axis{fill:var(--muted);font-family:var(--f-mono);font-size:11.5px}
.dg .pt{fill:var(--accent);font-family:var(--f-mono);font-size:12px;font-weight:500}
.dg .lbl{fill:var(--muted);font-size:13px;pointer-events:none}
.dg .mk{fill:var(--heat);stroke:var(--surface);stroke-width:2}
.dg .mkl{stroke:var(--heat);stroke-width:1;stroke-dasharray:3 3}
.dg-ctrl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.dg-ctrl label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.dg-ctrl input{width:100%;accent-color:var(--heat)}
.dg-info{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.dg-info h3{font-size:22px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 12px;font-size:14.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}

.mobile-nav{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .mobile-nav{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto;gap:2px;padding:8px 16px}
  .mobile-nav a{white-space:nowrap;padding:7px 11px;border-radius:999px;text-decoration:none;color:var(--ink);font-size:14px;font-weight:500}
  .mobile-nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  main{padding-block:20px 48px;padding-inline:16px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .topic{grid-template-columns:minmax(0,1fr)}
  .q-body{padding-left:16px}
  .cmp,.dg-info,.dg-ctrl{grid-template-columns:minmax(0,1fr)}
  .view-head h1{font-size:25px}
  .reader-head h2{font-size:23px}
}
@media (prefers-reduced-motion:reduce){ .card-in{transition:none} }

/* Print: one lecture or the questions on A4 (buttons «Տպել»). Light colors, no navigation or controls. */
.print-only{display:none}
.print-row{gap:8px;align-items:center}
.print-note{font-size:13px;color:var(--muted)}
.print-row .btn:disabled{opacity:.5;cursor:not-allowed}
.q-sel{display:grid;grid-template-columns:20px 52px minmax(0,1fr);gap:12px;align-items:start;padding:14px 16px;cursor:pointer}
.q-sel input{margin-top:4px;width:16px;height:16px;accent-color:var(--accent)}
.q-sel:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.pq{display:flex;flex-direction:column;gap:8px}
.pq>h3{display:flex;gap:10px;font-size:17px}
@media print{
  @page{size:A4;margin:14mm 15mm 16mm;@bottom-center{content:counter(page);font-size:9pt;color:#56636C}}
  :root:not(#_){--bg:#EDF0F0; --surface:#FAFBFB; --sunk:#E3E8E9; --ink:#162027; --muted:#56636C; --line:#CDD5D8;
    --accent:#2A4C9C; --accent-ink:#FFFFFF; --accent-soft:#DCE4F5; --heat:#B4530F; --heat-soft:#F6E2D2;

<p>Մարդկային քաղաքակրթության դարաշրջանները կրում են այն նյութերի անունները, որոնցից օգտվել է մարդը՝ <b>քարի, պղնձի, բրոնզի և երկաթի դար</b>։ Մետաղներից մարդն օգտվում է մոտավորապես <b>6000 տարի</b>։ Տեխնիկական նյութերի շարքում առաջին տեղը միշտ գրավել են մետաղները։</p>
<p>Մետաղները պետք է աշխատեն բացարձակ զրոյից մինչև շատ բարձր ջերմաստիճաններում, ագրեսիվ գազային և հեղուկ միջավայրերում, վակուումում և բարձր ճնշման տակ, ճառագայթման պայմաններում։ Ուստի դրանք պետք է ունենան մեխանիկական, ֆիզիկաքիմիական և տեխնոլոգիական հատկությունների որոշակի համալիր։</p>
<p>Մետաղի հատկությունները որոշվում են նրա ներքին <b>ստրուկտուրայով (կառուցվածքով)</b>։ Համաձուլվածքի ստրուկտուրան իր հերթին կախված է՝</p>
<ul><li>քիմիական բաղադրությունից,</li><li>ստացման տեխնոլոգիայից,</li><li>հետագա մշակումից (մեխանիկական, ջերմային, քիմիական, ֆիզիկական կամ համակցված)։</li></ul>
<div class="key"><b>Մետաղագիտությունը</b> ուսումնասիրում է, մի կողմից, <b>հատկությունների կախումը ստրուկտուրայից</b>, մյուս կողմից՝ <b>ստրուկտուրայի կախումը մշակումից</b>։</div>
<p>Մետաղագիտության հիմնադիրներն են ռուս մետալուրգներ <b>Պ.Պ. Անոսովը</b> և <b>Դ.Կ. Չեռնովը</b>։ Մեքենաշինության գլխավոր նյութերն են մետաղները և դրանց համաձուլվածքները, որոնց հետ միասին օգտագործվում են նաև օրգանական և անօրգանական ոչ մետաղական նյութեր՝ ռետիններ, փայտանյութեր, ապակիներ, կերամիկա։</p>` },

  { h: "Մեխանիկական հատկություններ", html: `
<dl>
<dt>Կոշտություն</dt><dd>Առաձգական դեֆորմացիային դիմադրելու մետաղի հատկությունը։ Ցուցանիշը՝ <b>նորմալ առաձգականության մոդուլը (Յունգի մոդուլ) E</b>, Ն/մմ²։ Ձգման կորի սկզբնական ուղղագիծ մասում լարումը համեմատական է երկարացմանը (<b>Հուկի օրենք</b>)․ E-ն հավասար է այդ մասի թեքության α անկյան տանգենսին։</dd>

<ul><li><b>Ֆիզիկական հոսունության սահման σ<sub>տ</sub></b> (σ<sub>т</sub>)՝ նվազագույն լարումը, որի դեպքում նմուշը երկարում է առանց բեռի զգալի մեծացման («հոսունության հարթակ»)։</li>

<li><b>Ժամանակավոր դիմադրություն σ<sub>բ</sub></b> (σ<sub>в</sub>, ամրության սահման)՝ ամենամեծ բեռին համապատասխանող լարումը։</li></ul></dd>
<dt>Պլաստիկություն</dt><dd>Արտաքին ուժերի ազդեցությամբ առանց քայքայվելու ձևը փոխելու և ուժը հանելուց հետո նոր ձևը պահպանելու հատկությունը։ Ցուցանիշները որոշվում են ձգման փորձարկմամբ՝

<p>Ռոկվելի կամ Վիկերսի բարձր կարծրությունը ծառայում է որպես <b>մաշակայունության</b> ցուցանիշ։ Կարծրության չափումը լայնորեն կիրառում են պատրաստի արտադրանքի և տեխնոլոգիական պրոցեսի տարբեր փուլերում մետաղի հսկման համար։</p>`, figs: [["l1-003","Կարծրության որոշում․ ա՝ Բրինել, բ՝ Վիկերս, գ՝ Ռոկվել"]] },
  { h: "Ֆիզիկաքիմիական հատկություններ", html: `
<dl>
<dt>Խտություն</dt><dd>Միավոր ծավալում պարունակվող մետաղի զանգվածը (գ/սմ³)։ Որոշում են հիդրոստատիկ եղանակով՝ <b>Արքիմեդի օրենքի</b> հիման վրա։ Պարզ մետաղների խտությունը փոխվում է <b>0,53 գ/սմ³ (լիթիում)</b>-ից մինչև <b>22,5 գ/սմ³ (իրիդիում)</b>։ Տեխնիկական մետաղները հիմնականում <b>ծանր</b> են (&gt;5 գ/սմ³)։ <b>3 գ/սմ³</b>-ից փոքր խտությամբ մետաղները (մագնեզիում, ալյումին և դրանց համաձուլվածքներ) կոչվում են <b>թեթև</b>․ դրանք կիրառում են ինքնաթիռաշինության, նավաշինության, երկաթուղային տրանսպորտում։</dd>
<dt>Ջերմային ընդարձակում</dt><dd>Ջերմաստիճանի փոփոխմամբ գծային չափերը փոփոխելու հատկությունը․ բնութագրվում է <b>ջերմային ընդարձակման գործակցով α</b> (աստ⁻¹)։ Քանի որ այն կախված է ջերմաստիճանից, օգտվում են կամ միջին գործակցից, կամ տվյալ T-ի իրական գործակցից։</dd>
<dt>Էլեկտրահաղորդականություն</dt><dd>Էլեկտրական հոսանք հաղորդելու հատկությունը։ Մետաղներինը <b>10²⁰–10²⁵ անգամ</b> բարձր է ոչ մետաղներից, և ջերմաստիճանի բարձրացմամբ <b>նվազում է</b> (ոչ մետաղներինը՝ աճում)։ Տեսակարար էլեկտրահաղորդականությունը մետաղների համար մոտ 10⁴–10⁶ Օհմ⁻¹·սմ⁻¹ է։ Պղինձը, ալյումինը, արծաթը օգտագործվում են որպես հաղորդիչներ։</dd>
<dt>Էլեկտրադիմադրություն ρ</dt><dd>Էլեկտրահաղորդականության հակադարձ մեծությունը (Օհմ·սմ)։ Բարձր օհմական դիմադրությամբ համաձուլվածքները կիրառվում են վառարանների տաքացուցիչների, ռեոստատների համար։</dd>
<dt>Մագնիսական հատկություններ</dt><dd>Ֆեռոմագնիսական նյութերի հատկությունները բնութագրում է <b>հիստերեզիսի օղակը</b>։ H դաշտի աճի ժամանակ մետաղը մագնիսանում է մինչև հագեցում։ Դաշտը հանելուց հետո մնում է <b>մնացորդային մագնիսական ինդուկցիա B<sub>r</sub></b>։ Մագնիսականությունը լրիվ վերացնելու համար անհրաժեշտ հակառակ ուղղության դաշտը կոչվում է <b>կոերցիտիվ ուժ H<sub>c</sub></b>։ <b>μ = B/H</b> հարաբերությունը՝ <b>մագնիսական թափանցելիություն</b>։</dd>
<dt>Կոռոզիակայունություն</dt><dd>Շրջապատող միջավայրի քայքայող ազդեցությանը դիմադրելու հատկությունը։ Գնահատում են <b>կոռոզիայի արագությամբ</b>՝ մակերևույթի նվազումը մմ/տարի։ Ջրում, աղերի և թթուների լուծույթներում կոռոզիայի նկատմամբ կայուն մետաղները կոչվում են <b>չժանգոտվող</b>։</dd>
</dl>`, figs: [["l1-004","Հիստերեզիսի օղակ․ B-ի կախումը H-ից, B_r, H_c"]] },
  { h: "Տեխնոլոգիական հատկություններ", html: `
<p>Մետաղի այն հատկություններն են, որոնք թույլ են տալիս կիրառել տեխնոլոգիական պրոցեսներ՝ անհրաժեշտ ձևի և չափերի շինվածքներ ստանալու համար։</p>
<dl>
<dt>Ձուլման հատկություններ</dt><dd>Ձուլաձևերում լցնելու և լավ ձուլվածքներ ստանալու հնարավորությունը։ Հիմնականները՝
<ul><li><b>Հեղուկահոսունություն</b>՝ հեղուկ մետաղի ձուլաձևը լցնելու ունակությունը (կարևոր է բարակ պատերով ձուլվածքների համար)․ կախված է բաղադրությունից, հալման և լցման ջերմաստիճանից։</li>
<li><b>Կծկում</b>՝ ծավալի փոքրացումը հեղուկից պինդ վիճակի անցնելիս․ ձուլվածքի չափերը փոքր են ձուլաձևի չափերից։</li></ul></dd>
<dt>Պլաստիկություն (ճնշմամբ մշակելիություն)</dt><dd>Սառը և տաք ճնշմամբ մշակմամբ (գլանում, կռում, մամլում, դրոշմում) պրոֆիլներ, նախապատրաստվածքներ և դետալներ ստանալու հնարավորությունը։</dd>
<dt>Եռակցելիություն</dt><dd>Եռակցման ժամանակ ամուր, բավարար միացում առաջացնելու հատկությունը։</dd>
<dt>Մշակելիություն կտրմամբ</dt><dd>Հիմնական բնութագիրը՝ <b>կտրման արագությունը V<sub>T</sub></b> (մ/րոպե), որի դեպքում Р18 արագահատ պողպատե կտրիչը բթանում է որոշակի T ժամանակում։ Մոտավոր ցուցանիշ կարող է լինել ժամանակավոր դիմադրությունը կամ Բրինելի կարծրությունը։</dd>

  id: 2, title: "Մետաղների ատոմաբյուրեղային կառուցվածքը", topics: ["1.3", "1.4"],
  sections: [
  { h: "Մետաղական կապ", html: `
<p><b>Պարզ մետաղը</b> հիմնականում մեկ մետաղական տարրից բաղկացած նյութն է։ Մետաղները ոչ մետաղներից տարբերվում են՝ <b>բարձր էլեկտրահաղորդականությամբ, պլաստիկությամբ, լույս անդրադարձնելու ունակությամբ (փայլով) և բարձր ջերմահաղորդականությամբ</b>։</p>
<p>Ատոմը կազմված է դրական միջուկից (պրոտոններ և նեյտրոններ) և էլեկտրոններից։ Արտաքին թաղանթում կարող է լինել 1–8 վալենտային էլեկտրոն․ մետաղներն ունեն նվազագույն թիվը՝ <b>հիմնականում 1 կամ 2, հազվադեպ 3</b>։</p>
<p>Դրական իոնների միջև քաոսային շարժվող ազատ էլեկտրոնների ամբողջությունը կոչվում է <b>էլեկտրոնային գազ</b>։ Դրական իոնների և էլեկտրոնային գազի միջև էլեկտրական ձգողության ուժերը ստեղծում են ամուր կապ, որը կոչվում է <b>մետաղական կապ</b>։ Դրանով են բացատրվում մետաղներին բնորոշ բոլոր հատկությունները։</p>
<p>Ոչ մետաղներում ազատ էլեկտրոններ չկան, բայց ջերմաստիճանի բարձրացմամբ նրանց էլեկտրահաղորդականությունը աճում է (մետաղներինը՝ նվազում)։</p>`, figs: [["l2-000","Արտաքին ուժի ազդեցությունը մետաղական (ա) և իոնային (բ) կապով բյուրեղների վրա․ մետաղականում շերտերի տեղաշարժը կապը չի խզում"]] },
  { h: "Բյուրեղային և ամորֆ մարմիններ", html: `
<p>Ատոմների դասավորության երկրաչափական կարգը կոչվում է <b>բյուրեղային կառուցվածք</b>, այդպիսի կառուցվածք ունեցող մարմինները՝ <b>բյուրեղային մարմիններ</b>։</p>
<ul><li>Բյուրեղային մարմինը պինդից հեղուկ (և հակառակը) անցնում է <b>կտրուկ, խիստ որոշակի (կրիտիկական) ջերմաստիճանում</b>։ Հալվելիս կլանում է, պնդանալիս անջատում է <b>բյուրեղացման թաքնված ջերմությունը</b> (սառեցման կորի վրա՝ հորիզոնական հարթակ)։</li>
<li><b>Ամորֆ</b> մարմիններում ատոմների կանոնավոր դասավորություն չկա․ դրանք աստիճանաբար փափկում են, և անցման որոշակի ջերմաստիճան նշել հնարավոր չէ։</li></ul>`, figs: [["l2-002","Սառեցման կորեր․ ա՝ մետաղ (հարթակ T_կ-ում), բ՝ ամորֆ նյութ"]] },
  { h: "Բյուրեղային ցանց, տարրական բջիջ, կոորդինացիոն թիվ", html: `
<p>Մետաղական բյուրեղը կարելի է դիտել որպես կանոնավոր դասավորված գնդերի համակարգ։ Այն հարթությունները, որոնցում դասավորված են ատոմները, կոչվում են <b>ատոմային հարթություններ</b>։ Ցանցի գծերով սահմանափակված ամենափոքր ծավալը կոչվում է <b>տարրական բջիջ</b> (վանդակ)։ Բջջի կողի երկարությունը՝ <b>ցանցի պարամետր a</b>։</p>
<p><b>Կոորդինացիոն թիվը</b> ցանցի յուրաքանչյուր ատոմից ամենամոտ և հավասար հեռավորության վրա գտնվող հարևան ատոմների թիվն է․ այն բնութագրում է դասավորության խտությունը։ Մետաղների մեծ մասի համար այն <b>8 կամ 12</b> է, պարզ խորանարդայինի համար՝ <b>6</b>։</p>
<p>Ցանցը նշանակում են բջջի ձևը ցույց տվող տառով և կոորդինացիոն թվով․ պարզ խորանարդային ցանց՝ <b>К6</b>։</p>`, figs: [["l2-001","Պարզ խորանարդային ցանց, a՝ ցանցի պարամետր"]] },

  { h: "Պոլիմորֆիզմ (ալոտրոպիա)", html: `

</ul>` },
  { h: "Անիզոտրոպիա", html: `
<p>Ամբողջովին մեկ բյուրեղից կազմված մետաղի կտորը կոչվում է <b>միաբյուրեղ</b>։ Բյուրեղային կառուցվածքը պայմանավորում է <b>անիզոտրոպիան</b>՝ տարբեր ուղղություններով հատկությունների անհավասարությունը (քանի որ տարբեր ուղղություններով ատոմների խտությունը տարբեր է)։</p>

<p>Ցանցում ատոմները մշտապես տատանվում են մոտ <b>10¹³ Հց</b> հաճախությամբ։ Բյուրեղային ցանցի թերությունները բաժանվում են <b>կետային, գծային և մակերևութային</b>։</p>

<dt>Մակերևութային (արեալ)</dt><dd>Բազմաբյուրեղ մետաղի <b>հատիկների միջև մեծանկյուն սահմանները</b>, որտեղ ատոմների դասավորությունը խախտված է։</dd>

  id: 3, title: "Մետաղների բյուրեղացումը և պլաստիկ դեֆորմացիան", topics: ["2.1", "2.2", "2.3"],
  sections: [
  { h: "Առաջնային բյուրեղացում", html: `
<div class="key">Հեղուկից պինդ վիճակի անցման ժամանակ ընթացող բյուրեղացումը կոչվում է <b>առաջնային բյուրեղացում</b>։</div>
<p>Ատոմների ամբողջությունը (համակարգ) ունի <b>ազատ էներգիա F</b> (կարող է անջատվել առանց ջերմաստիճանի փոփոխման՝ իզոթերմ) և <b>կապված էներգիա</b> (անջատվում է միայն ջերմաստիճանի փոփոխմամբ)։</p>
<ul>
<li><b>T<sub>կ</sub></b> (տեսական բյուրեղացման ջերմաստիճան) կետում հեղուկի և պինդի ազատ էներգիաները հավասար են՝ F<sub>հ</sub> = F<sub>պ</sub>։</li>
<li>T<sub>կ</sub>-ից բարձր փոքր է հեղուկի F-ը (կայուն է հեղուկը), ցածր՝ պինդինը։</li>
<li>Բյուրեղացումը սկսվում է միայն, երբ մետաղը սառեցվել է T<sub>կ</sub>-ից ցածր, այսինքն <b>գերսառեցված</b> է ΔT-ով։ ΔT-ն կոչվում է <b>գերսառեցման աստիճան</b>։</li>
</ul>`, figs: [["l3-000","Հեղուկ և պինդ վիճակների ազատ էներգիայի կախումը ջերմաստիճանից, ΔT"]] },
  { h: "Բյուրեղացման մեխանիզմը", html: `
<p>Բյուրեղացումը ընթանում է երկու տարրական պրոցեսով՝ <b>բյուրեղացման կենտրոնների (սաղմերի) առաջացում</b> և <b>դրանց աճ</b>։</p>
<ul>
<li><b>Կենտրոնների առաջացման արագություն n</b>՝ միավոր ծավալում միավոր ժամանակում առաջացած կենտրոնների թիվը (մմ⁻³·րոպե⁻¹)։</li>
<li><b>Աճի գծային արագություն c</b>՝ միավոր ժամանակում աճող բյուրեղի եզրի տեղաշարժը (մմ/րոպե)։</li>
</ul>
<p>Հատիկի չափը որոշվում է n-ի և c-ի հարաբերությամբ։ <span class="sup">Գերսառեցման աճով n-ը աճում է ավելի արագ, քան c-ն, ուստի արագ սառեցումը տալիս է մանր հատիկ։ Հատիկը մանրացնում են նաև մոդիֆիկատորներով։</span></p>
<div class="key">Հատիկի <b>փոքրացմամբ</b> մետաղի մեխանիկական հատկությունները <b>մեծանում են</b>։</div>`, figs: [["l3-001","Բյուրեղների առաջացման և աճի սխեմա պնդացման ժամանակ"]] },
  { h: "Երկրորդային բյուրեղացում և մագնիսական փոխակերպում", html: `
<p>Պոլիմորֆ մետաղի մոդիֆիկացիաների ազատ էներգիան կախված է ջերմաստիճանից․ T<sub>կ</sub>-ից ցածր կայուն է M<sub>α</sub>-ն (փոքր F), բարձր՝ M<sub>β</sub>-ն։</p>
<div class="key">Պինդ վիճակում բյուրեղային ցանցի մի ձևից մյուսին անցումը (պոլիմորֆ փոխակերպումը) ուղեկցվում է վերաբյուրեղացմամբ և կոչվում է <b>երկրորդային բյուրեղացում</b>։</div>
<p><b>Մագնիսական փոխակերպում</b>․ ֆեռոմագնիսական մետաղները (երկաթ, նիկել, կոբալտ) որոշ ջերմաստիճանում կորցնում են ֆեռոմագնիսականությունը։ Այդ ժամանակ <b>չեն փոխվում ոչ բյուրեղային ցանցը, ոչ հատիկային ստրուկտուրան</b>․ փոխվում է արտաքին էլեկտրոնային թաղանթների փոխազդեցությունը։ Հատկությունները փոխվում են աստիճանաբար և անհետանում են <b>Կյուրիի կետում</b>․</p>

  { h: "Մետաղական ձույլի կառուցվածքը", html: `
<p>Պողպատե ձույլի կառուցվածքը առաջինն ուսումնասիրել է <b>Դ.Կ. Չեռնովը</b>։ Ձույլը պնդանում է թուջե ձուլաձևում (մետաղակաղապարում)։</p>

  { h: "Դեֆորմացիա և քայքայում", html: `
<p>Լարումը բյուրեղային ցանցում բաժանվում է <b>նորմալ σ</b> և <b>շոշափող τ</b> բաղադրիչների։</p>
<ul>
<li><b>Առաձգական դեֆորմացիա</b>՝ վերանում է լարումը հանելուց հետո։</li>
<li>Նորմալ <b>σ</b> լարումները կարող են առաջացնել միայն առաձգական դեֆորմացիա կամ քայքայում (պոկում)։ Քայքայումը, որին չի նախորդում պլաստիկ դեֆորմացիա, կոչվում է <b>բեկուն քայքայում</b>։</li>
<li>Շոշափող <b>τ</b> լարումները կարող են առաջացնել առաձգական, <b>պլաստիկ դեֆորմացիա</b> կամ քայքայում կտրման ճանապարհով։ Նախնական պլաստիկ դեֆորմացիայից հետո քայքայումը կոչվում է <b>պլաստիկ (մածուցիկ) քայքայում</b>։</li>
</ul>
<p><b>Միաբյուրեղի և բազմաբյուրեղի պլաստիկ դեֆորմացիա</b>․ իրական մետաղներում պլաստիկ դեֆորմացիան իրագործվում է <b>դիսլոկացիոն մեխանիզմով</b>՝ բյուրեղի մի մասի սահքը մյուսի նկատմամբ դիսլոկացիաների տեղաշարժով։ <span class="sup">Սահքն ընթանում է ատոմներով ամենախիտ հարթություններով և ուղղություններով։ Բազմաբյուրեղում հատիկները ձգվում են դեֆորմացիայի ուղղությամբ, առաջանում է թելքավոր ստրուկտուրա և հատիկների կողմնորոշում՝ տեքստուրա։ Հատիկների սահմանները խոչընդոտում են դիսլոկացիաների շարժմանը, ուստի բազմաբյուրեղն ավելի ամուր է միաբյուրեղից։</span></p>`, figs: [["l3-003","Ցանցի վրա ազդող լարման բաժանումը նորմալ (σ) և շոշափող (τ) բաղադրիչների"]] },
  { h: "Կոփում (наклёп)", html: `

  sections: [
  { h: "Համաձուլվածք, կոմպոնենտ, ֆազ", html: `
<dl>
<dt>Համաձուլվածք</dt><dd>Երկու կամ ավելի տարրերից բաղկացած նյութ, որի հիմնականը մետաղական տարրն է։ Ստանում են հիմնականում հեղուկ վիճակում հալեցնելով։</dd>
<dt>Կոմպոնենտներ</dt><dd>Այն տարրերը կամ քիմիական միացությունները, որոնք անհրաժեշտ և բավարար են տվյալ համաձուլվածքը ստանալու համար։ Հիմնականը միշտ մետաղ է, մյուսները կարող են լինել ոչ մետաղներ (պողպատում՝ Fe-ը մետաղ է, C-ն՝ ոչ մետաղ)։ Ըստ թվի՝ <b>երկակի, եռակի</b> և ավելի բարդ։</dd>
<dt>Խառնուկներ</dt><dd>Համաձուլվածքի կազմի մեջ մտնող, բայց կոմպոնենտ չհանդիսացող տարրեր․ <b>վնասակար խառնուկներ</b>, եթե բացասաբար են ազդում հատկությունների վրա։ Մաքուր կոմպոնենտներ գոյություն չունեն․ 99,99% Fe-ում հայտնաբերվել է <b>27 տարր</b>՝ գումարային 0,01%։</dd>
<dt>Ֆազ</dt><dd>Համաձուլվածքի այն համասեռ մասը, որն ունի միևնույն <b>ագրեգատային վիճակ, քիմիական բաղադրություն և բյուրեղային ցանց</b>։ Օր․ բյուրեղացվող պարզ մետաղը երկֆազ է՝ հեղուկ և պինդ (բաղադրությունը նույնն է, վիճակը՝ տարբեր)։</dd>
</dl>
<p>Պինդ համաձուլվածքում ֆազերի երկու հիմնական տեսակ կա՝ <b>պինդ լուծույթներ</b> և <b>քիմիական միացություններ</b>․ դրանց հնարավոր համակցությունը տալիս է <b>մեխանիկական խառնուրդ</b>։</p>` },
  { h: "Պինդ լուծույթներ", html: `
<p><b>Պինդ լուծույթը</b> կոմպոնենտների ատոմների համասեռ խառնուրդ է, որը հեղուկ լուծույթից տարբերվում է միայն բյուրեղային կառուցվածքով։ Պահպանվում է <b>լուծիչ մետաղի ցանցը</b>։ Նշանակում են A(B)՝ B-ի լուծույթ A-ում, կամ α, β, γ տառերով։</p>
<h4>ա) Տեղակալման (փոխարինման) պինդ լուծույթներ</h4>
<p>Լուծիչի ատոմները մասամբ փոխարինված են լուծվողի ատոմներով։ Կարող են լինել <b>անսահմանափակ</b> կամ <b>սահմանափակ</b>։ Անսահմանափակ լուծելիության պայմանները՝</p>
<ol><li>կոմպոնենտների բյուրեղային ցանցերը <b>նույնատիպ</b> են,</li><li>ատոմների տրամագծերը քիչ են տարբերվում <span class="sup">(ոչ ավելի քան 8–15%)</span>,</li><li>վալենտականությունների տարբերությունը <b>մեկից մեծ չէ</b>։</li></ol>
<p>Եթե պայմանները չեն պահպանվում, առաջանում են սահմանափակ պինդ լուծույթներ կամ ընդհանրապես չեն առաջանում։ <span class="sup">Օրինակ՝ Cu–Ni (երկուսն էլ К12)։</span></p>
<h4>բ) Ներդրման պինդ լուծույթներ</h4>
<p>Լուծված տարրի ատոմները տեղավորվում են լուծիչի ցանցի <b>միջատոմային դատարկություններում</b>, լուծիչի ատոմները պահպանում են դասավորությունը։ Կարող են ներդրվել այն ատոմները, որոնց տրամագիծը չի գերազանցում լուծիչ ատոմի տրամագծի <b>59%</b>-ը <span class="sup">(ածխածին, ազոտ, ջրածին, բոր)</span>։ Ներդրման լուծույթները միշտ <b>սահմանափակ</b> են։ Օր․ ֆերիտ և աուստենիտ՝ C-ի լուծույթներ Fe-ում։</p>`, figs: [["l4-000","Տեղակալման պինդ լուծույթ A(B)"],["l4-001","Ներդրման պինդ լուծույթ A(B)"]] },

<ul>
<li>Ունեն <b>հաստատուն բաղադրություն</b>, որը որոշվում է բանաձևով։ Օր․ <b>Fe₃C</b> (երկաթի կարբիդ)․ 3 ատոմ Fe-ին՝ 1 ատոմ C, ըստ զանգվածի <b>93,33% Fe և 6,67% C</b>։</li>

</ul>` },

<p>Եթե կոմպոնենտները հեղուկ և պինդ վիճակում ունեն անսահմանափակ լուծելիություն, պնդացման ժամանակ հեղուկ լուծույթը վերածվում է պինդ լուծույթի․ համաձուլվածքը <b>միաֆազ</b> է, ստրուկտուրան նման է պարզ մետաղի ստրուկտուրային։</p>

  { h: "Վիճակի դիագրամ", html: `
<p><b>Վիճակի դիագրամը</b> համաձուլվածքի ագրեգատային վիճակի և ստրուկտուրայի փոփոխման գրաֆիկական պատկերն է՝ կախված բաղադրությունից և ջերմաստիճանից։</p>

  { h: "Գիբսի ֆազերի կանոն", html: `

<p>Եթե ճնշումն էլ է փոփոխական՝ C = K − Ф + 2։</p>

<tr><td>Պարզ մետաղի պնդացում (հեղուկ + պինդ)</td><td>1</td><td>2</td><td><b>0</b></td><td>հորիզոնական հարթակ</td></tr>

  { h: "Անսահմանափակ լուծելիությամբ դիագրամ (Cu–Ni)", html: `
<p>Կոմպոնենտները անսահմանափակ լուծվում են հեղուկ և պինդ վիճակում․ ցանկացած համաձուլվածք բյուրեղանալով դառնում է պինդ լուծույթ։ Բյուրեղացման ժամանակ Ф = 2, K = 2 → <b>C = 1</b>․ բյուրեղացումն ընթանում է <b>նվազող ջերմաստիճանում</b>, սառեցման կորն ունի երկու շրջման կետ (սկիզբ և վերջ)։ Մաքուր կոմպոնենտներն ունեն մեկ կրիտիկական կետ՝ <b>պղինձ 1083°C</b>, <b>նիկել 1452°C</b>։</p>

<ul><li>Առաձգական դեֆորմացիա՝ վերանում է բեռը հանելուց հետո, պլաստիկը՝ մնում է։</li>
<li>Լարումը՝ նորմալ σ (առաձգական դեֆ․ կամ պոկում) և շոշափող τ (առաձգական, պլաստիկ դեֆ․ կամ կտրում)։</li>
<li>Պլաստիկ դեֆորմացիան՝ սահքով, դիսլոկացիաների շարժմամբ, ամենախիտ հարթություններով։ Բազմաբյուրեղում՝ հատիկների ձգում, թելքավոր ստրուկտուրա, տեքստուրա։</li>
<li>Քայքայում․ <b>բեկուն</b> (առանց նախնական պլաստիկ դեֆորմացիայի) և <b>պլաստիկ (մածուցիկ)</b> (պլաստիկ դեֆորմացիայից հետո)։</li></ul>` },
 { id: "2.3", sec: [5,6,7], t: 2, q: "Մետաղների կոփումը և վերաբյուրեղացումը", l: 3, a: `
<ul><li><b>Կոփում</b>՝ հատկությունների փոփոխում պլաստիկ դեֆորմացիայից (դիսլոկացիաների խտություն 10⁶–10⁸ → 10¹² սմ⁻²)․ ամրությունը և կարծրությունը ↑, պլաստիկությունը ↓։</li>
<li>Տաքացում․ <b>վերադարձ</b> (վականսիաների նվազում), <b>պոլիգոնացում</b> (դիսլոկացիաների վերադասավորում), <b>վերաբյուրեղացում</b> (նոր հավասարառանցք հատիկներ)։</li>
<li>Բոչվար․ T<sub>վ</sub> = α·T<sub>հալ</sub> (K), α ≈ 0,4․ թրծումը՝ T<sub>վ</sub> + 200–300°C․ վերաբյուրեղացման թրծում։</li>
<li>Կրիտիկական դեֆորմացիա → խոշոր հատիկ։</li>
<li>Տաք մշակում (T &gt; T<sub>վ</sub>, առանց կոփման) և սառը մշակում (T &lt; T<sub>վ</sub>, կոփում)։</li></ul>` },
 { id: "3.1", sec: [0,1,2,3], t: 3, q: "Մետաղական համաձուլվածքներ։ Բաղադրիչները և ֆազերը։ Պինդ լուծույթներ, քիմիական միացություններ, մեխանիկական խառնուրդներ", l: 4, a: `
<ul><li>Համաձուլվածք, կոմպոնենտ, խառնուկ, ֆազ (միևնույն ագրեգատային վիճակ, բաղադրություն և ցանց)։</li>
<li><b>Պինդ լուծույթներ</b>՝ պահպանվում է լուծիչի ցանցը․ <b>տեղակալման</b> (անսահմանափակ՝ նույնատիպ ցանց, մոտ տրամագծեր, վալենտականության տարբերություն ≤ 1) և <b>ներդրման</b> (տրամագիծ ≤ 59% լուծիչինից, միշտ սահմանափակ)։</li>
<li><b>Քիմիական միացություններ</b>՝ հաստատուն բաղադրություն ըստ բանաձևի (Fe₃C՝ 6,67% C), սեփական ցանց, մետաղական կապ․ օքսիդները և սուլֆիդները՝ իոնական։</li>
<li><b>Մեխանիկական խառնուրդ</b>՝ հեղուկը պնդանալիս տրոհվում է երկու ֆազերի մասնիկների։</li></ul>` },
 { id: "3.2", sec: [0,1,3], t: 3, q: "Երկակի համաձուլվածքների վիճակի դիագրամներ։ Գիբսի ֆազերի կանոնը։ Հատվածների կանոնը", l: 5, a: `
<ul><li>Վիճակի դիագրամ՝ «բաղադրություն–ջերմաստիճան», հավասարակշռված պայմաններ, կառուցում ջերմային անալիզով։</li>
<li><b>C = K − Ф + 1</b> (P = const)․ պարզ մետաղ՝ C = 0 (հարթակ)․ երկակի, 2 ֆազ՝ C = 1 (միջակայքում)․ երկակի, 3 ֆազ՝ C = 0 (էվտեկտիկա)։</li>
<li><b>Հատվածների (լծակի) կանոն</b>․ կոնոդի ծայրերը տալիս են ֆազերի բաղադրությունը, ֆազերի քանակը հակադարձ համեմատական է հատվածներին։</li></ul>` },
 { id: "3.3", sec: [2,4,5], t: 3, q: "Պինդ վիճակում անսահմանափակ և սահմանափակ լուծելիությամբ համաձուլվածքների վիճակի դիագրամներ։ Հատկությունների կախումը դիագրամի տեսակից (Կուռնակով)", l: 5, a: `
<ul><li><b>Անսահմանափակ</b> (Cu–Ni)․ լիկվիդուս, սոլիդուս, α․ բյուրեղացում միջակայքում, դենդրիտային լիկվացիա և դիֆուզիոն թրծաթողում։</li>
<li><b>Սահմանափակ</b>․ α = A(B), β = B(A)․ էվտեկտիկա (Հ → α + β) և պերիտեկտիկա (Հ + α → β)։</li>
<li><b>Կուռնակով</b>․ մեխանիկական խառնուրդ → գծային կախում․ պինդ լուծույթ → կորագիծ, առավելագույնով (կարծրություն, ρ)․ քիմիական միացություն → եզակի կետ։</li></ul>` },
 { id: "3.4", sec: [0,1,2], t: 3, q: "Երկաթ–ածխածնային համաձուլվածքներ․ կոմպոնենտները, ֆազերը և ստրուկտուրային բաղադրիչները", l: 6, a: `
<ul><li>Fe․ 1539°C, A₃ 910°C, A₄ 1401°C, A₂ 769°C (Կյուրի), Fe<sub>α</sub> К8, Fe<sub>γ</sub> К12։ C․ գրաֆիտ (Г3) և ալմաստ։</li>
<li>Ֆազեր․ <b>ֆերիտ</b> (C-ը Fe<sub>α</sub>-ում, ≤ 0,02%), <b>աուստենիտ</b> (C-ը Fe<sub>γ</sub>-ում, ≤ 2,14%, &gt; 727°C), <b>ցեմենտիտ</b> Fe₃C (6,67%, HB 800), <b>գրաֆիտ</b>, հեղուկ։</li>
<li>Ստրուկտուրային բաղադրիչներ․ <b>պեռլիտ</b> (Ֆ + Ց, 0,8% C, 727°C, 88/12%), <b>լեդեբուրիտ</b> (Ա + Ց, 4,3% C, 1147°C, ցածր 727°C-ից՝ Պ + Ց)։</li>
<li>Կայուն՝ Ֆ, Ա, Գ․ մետաստաբիլ՝ Ց։</li></ul>` },
 { id: "3.5", sec: [3,4], t: 3, q: "Fe–Fe₃C վիճակի դիագրամը", l: 6, a: `
<ul><li>Գծեր․ ABCD լիկվիդուս, AHJECF սոլիդուս, HJB պերիտեկտիկա 1493°C, ECF էվտեկտիկա 1147°C (Հ<sub>4,3</sub> → Ա<sub>2,14</sub> + Ց = Լ), PSK էվտեկտոիդ 727°C (Ա<sub>0,8</sub> → Ֆ<sub>0,02</sub> + Ց = Պ), GS (A₃), SE (A<sub>cm</sub>), PQ։</li>
<li>Ցեմենտիտ․ առաջնային (CD, հեղուկից), երկրորդային (SE, աուստենիտից), երրորդային (PQ, ֆերիտից)։</li>
<li>Դասակարգում․ պողպատ ≤ 2,14% (մինչ-, էվ-, հետէվտեկտոիդային՝ 0,8%-ի նկատմամբ), չուգուն &gt; 2,14% (մինչ-, էվ-, հետէվտեկտիկական՝ 4,3%-ի նկատմամբ)։</li></ul>` },
 { id: "4.1", sec: [0,1,2], t: 4, q: "Ածխածնային պողպատներ․ դասակարգումը, մակնիշավորումը, կիրառման բնագավառները, կառուցվածքը և հատկությունները", l: 7, a: `
<ul><li>≤ 2% C (գործնականում ≤ 1,35%)․ պլաստիկ, ճնշմամբ մշակվող։ Մշտական խառնուկներ՝ Mn ≤ 0,8, Si ≤ 0,4, P ≤ 0,04, S ≤ 0,05%։</li>
<li>Ստրուկտուրա․ Ֆ + Պ / Պ / Պ + ՑII։ Ոչ մետաղական ներխառնուկներ։</li>
<li>Ազդեցություն․ C ↑ → ամրություն, կարծրություն ↑, պլաստիկություն ↓, եռակցելիություն ↓․ Mn, Si՝ ապաօքսիդիչներ (օգտակար)․ P՝ սառնաբեկունություն․ S՝ շիկաբեկություն։</li>
<li>Դասակարգում․ ըստ C (ցածր &lt; 0,3, միջին 0,3–0,65, բարձր &gt; 0,65), ըստ կիրառման (կոնստրուկցիոն, գործիքային), ըստ որակի (սովորական՝ А, Б, В խմբեր, Ст0–Ст6․ որակյալ՝ 08…45, 65Г․ գործիքային՝ У7–У13, У10А)։</li></ul>` },
 { id: "4.2", sec: [3], t: 4, q: "Չուգուններ․ դասակարգումը, մակնիշավորումը, կիրառման բնագավառները, կառուցվածքը և հատկությունները", l: 7, a: `
<ul><li>2,14–6,67% C (գործնականում 2,5–3,5%)․ պլաստիկ չեն, լավ ձուլվում են։</li>
<li>Գրաֆիտացում․ դանդաղ սառեցում (ավազե կաղապար) և Si → գրաֆիտ․ արագ սառեցում (մետաղե կաղապար), Mn, S → ցեմենտիտ։ S վնասակար, P՝ բարձրացնում է հեղուկահոսունությունը։</li>
<li><b>Սպիտակ</b> (ցեմենտիտ, HB 500, բեկուն), <b>գորշ</b> (թերթավոր գրաֆիտ, СЧ 12-28), <b>բարձրամուր</b> (գնդաձև, Mg/Ce, ВЧ 42-12), <b>կռելի</b> (փաթիլաձև, սպիտակի թրծաթողում 900–1000°C, КЧ 33-8)։</li>
<li>Մետաղական հիմք․ ֆերիտային, ֆերիտապեռլիտային, պեռլիտային։</li></ul>` },
 { id: "Լ1", sec: [3], t: 0, q: "Լաբ․ 1. Մետաղների կարծրության որոշումը Բրինելի և Ռոկվելի եղանակներով", l: 1, a: `
<ul><li><b>Բրինել</b>․ մխված պողպատե գնդիկը P բեռով սեղմում են նմուշին, չափում են դրոշմահետքի տրամագիծը d, HB = P / F (F՝ սֆերիկ դրոշմահետքի մակերես)։ Կիրառելի է մինչև 450 HB (փափուկ և միջին կարծրության մետաղներ)։</li>
<li><b>Ռոկվել</b>․ ալմաստե կոն (120°) կամ գնդիկ, կարծրությունը կարդում են սարքի սանդղակից՝ ըստ խրման խորության (HRC՝ կոն, կարծր մետաղներ․ HRB՝ գնդիկ, փափուկ)։ Արագ, թողնում է փոքր հետք։</li></ul>` },
 { id: "Լ2", sec: [2], t: 0, q: "Լաբ․ 2. Մետաղների մեխանիկական հատկությունները՝ ամրություն, պլաստիկություն, հարվածային մածուցիկություն", l: 1, a: `
<ul><li>Ձգման փորձարկում → ձգման դիագրամ․ E, σ<sub>տ</sub> (կամ σ<sub>0,2</sub>), σ<sub>բ</sub>, δ = (l − l₀)/l₀·100%, ψ = (F₀ − F)/F₀·100%։</li>
<li>Հարվածային ծռում ճոճանակավոր կոպրով կտրվածքով նմուշի վրա․ a<sub>Н</sub> = կոտրման աշխատանք / հատույթի մակերես (Ն·մ/սմ²)։</li></ul>` },
 { id: "Լ3", sec: [5,6,7], t: 0, q: "Լաբ․ 3. Մետաղի կոփումը և վերաբյուրեղացումը", l: 3, a: `
<ul><li>Նմուշները դեֆորմացնում են տարբեր աստիճանով → կարծրությունը աճում է (կոփում)։</li>
<li>Տաքացնում են տարբեր ջերմաստիճաններում → վերաբյուրեղացման ջերմաստիճանից բարձր կարծրությունը կտրուկ նվազում է, հատիկները դառնում են հավասարառանցք։ Կրիտիկական դեֆորմացիայից հետո՝ խոշոր հատիկ։ T<sub>վ</sub> = α·T<sub>հալ</sub>։</li></ul>` },
 { id: "Լ4", sec: [0], t: 0, q: "Լաբ․ 4. Ածխածնային պողպատների միկրոկառուցվածքի ուսումնասիրումը", l: 7, a: `

<ul><li>Սպիտակ՝ լեդեբուրիտ (+ պեռլիտ և ՑII կամ + ՑI)։</li>

/* ---------- 2.5 polymorphism of iron, tin plague ---------- */

// Re-render in light colors (canvas drawings read the theme), let images load, advance animations to a full frame, print, restore.
// set/unset switch the view into its print layout and back (used by the questions print).
function printView(set, unset){
  const root = document.documentElement, prev = root.getAttribute('data-theme'), y = window.scrollY;
  root.setAttribute('data-theme', 'light'); if (set) set(); render();
  const imgs = [...document.querySelectorAll('#main img')]; imgs.forEach(i => i.loading = 'eager');
  const loaded = Promise.all(imgs.map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  let restored = false;
  const restore = () => { if (restored) return; restored = true; window.removeEventListener('afterprint', restore);
    if (prev == null) root.removeAttribute('data-theme'); else root.setAttribute('data-theme', prev);
    if (unset) unset(); if (window.vizPrint) vizPrint.done(); render(); window.scrollTo(0, y); };
  window.addEventListener('afterprint', restore);
  Promise.race([loaded, new Promise(r => setTimeout(r, 3000))]).then(() => {
    if (window.vizPrint) vizPrint.prep();
    setTimeout(() => { window.print(); }, 150);
  });
}
function bindLectures(){
  document.querySelectorAll('[data-lec]').forEach(b => b.onclick = () => { curLec = +b.dataset.lec; lecQuery=''; render(); window.scrollTo(0,0); });
  document.querySelectorAll('[data-jump]').forEach(b => b.onclick = e => { e.preventDefault(); const [L,i] = b.dataset.jump.split(':'); curLec=+L; lecQuery=''; render(); const el = document.getElementById('s'+L+'-'+i); if (el) el.scrollIntoView({behavior:'smooth'}); });
  const q = $('#lecq'); if (q){ q.oninput = () => { lecQuery = q.value; const pos=q.selectionStart; render(); const n=$('#lecq'); n.focus(); n.setSelectionRange(pos,pos); }; }
  const st = $('#supt'); if (st) st.onchange = () => { S.sup = st.checked; save(); render(); };
  const mr = $('#markread'); if (mr) mr.onclick = () => { S.read[curLec] = !S.read[curLec]; save(); render(); };
  document.querySelectorAll('[data-qlec]').forEach(a => a.onclick = () => { qFilter = 'l'+a.dataset.qlec; });
  document.querySelectorAll('[data-zlec]').forEach(a => a.onclick = () => { quizCfg.lec = a.dataset.zlec; quiz = null; });
  document.querySelectorAll('[data-print]').forEach(b => b.onclick = () => printView());
  if (window.mountViz) mountViz();
}

let openQ = null, qFilter = 'all', shown = {};
function qMatches(q){
  if (qFilter==='all') return true;
  if (qFilter[0]==='l') return q.l === +qFilter.slice(1);
  if (qFilter==='weak') return rateOf(q.id) < 3;
  return true;
}
// Key points of a model answer = its <li> items; the student ticks the ones their written answer covered.
const points = q => [...q.a.matchAll(/<li>([\s\S]*?)<\/li>/g)].map(m => m[1]);
const chk = id => (S.chk[id] = S.chk[id] || []);
function checklist(q){
  const pts = points(q), c = chk(q.id), n = pts.filter((_,k)=>c[k]).length;

    ${pts.map((p,k)=>`<label class="cl-item"><input type="checkbox" data-ck="${q.id}" data-k="${k}" ${c[k]?'checked':''}><span>${p}</span></label>`).join('')}</div>`;
}
function answerSecs(q){
  const L = lecById(q.l);
  return `<div class="full-in ${S.sup?'sup-on':''}">${q.sec.map(i => { const s = L.sections[i]; return `<section class="sec"><h3><span class="n">${L.id}.${i+1}</span>${s.h}</h3><div class="prose">${wrapTables(s.html)}</div>${s.figs?`<div class="figs">${s.figs.map(figHTML).join('')}</div>`:''}</section>`; }).join('')}</div>`;
}
function fullAnswer(q, open){

        : `<button type="button" class="btn small" data-picking title="Նշել, թե որ հարցերը տպել">☑ Ընտրել հարցերը</button>`}
      <span class="print-note">${printNote()}</span></div>

function bindQuestions(){
  document.querySelectorAll('[data-qm]').forEach(b => b.onclick = () => { S.qmode = b.dataset.qm; save(); render(); });
  document.querySelectorAll('[data-tocheck]').forEach(b => b.onclick = () => { S.qmode = 'check'; openQ = b.dataset.tocheck; shown[openQ] = false; save(); render(); document.getElementById('q-'+openQ)?.scrollIntoView({block:'start'}); });
  document.querySelectorAll('[data-qf]').forEach(b => b.onclick = () => { qFilter = b.dataset.qf; render(); });
  document.querySelectorAll('[data-tq]').forEach(b => b.onclick = () => { openQ = openQ===b.dataset.tq ? null : b.dataset.tq; render(); });
  document.querySelectorAll('[data-show]').forEach(b => b.onclick = () => { shown[b.dataset.show] = true; render(); });
  document.querySelectorAll('[data-rq]').forEach(b => b.onclick = () => { S.rate[b.dataset.rq] = +b.dataset.r; save(); render(); });
  document.querySelectorAll('[data-pq]').forEach(b => b.onclick = () => printQuestions(toPrint().map(q => q.id), b.dataset.pq==='full'));
  document.querySelectorAll('[data-picking]').forEach(b => b.onclick = () => { picking = !picking; render(); });
  document.querySelectorAll('[data-pickall]').forEach(b => b.onclick = () => { D.questions.filter(qMatches).forEach(q => picked.add(q.id)); render(); });
  document.querySelectorAll('[data-pickclear]').forEach(b => b.onclick = () => { picked.clear(); render(); });
  // ticking updates the count and buttons in place (no re-render, keeps the scroll position)
  document.querySelectorAll('[data-pick]').forEach(c => c.onchange = () => {
    if (c.checked) picked.add(c.dataset.pick); else picked.delete(c.dataset.pick);
    $('.print-note').textContent = printNote(); document.querySelectorAll('[data-pq]').forEach(b => b.disabled = !picked.size);
  });
  document.querySelectorAll('[data-pq1]').forEach(b => b.onclick = () => printQuestions([b.dataset.pq1], true));
  bindWriting();
  if (openQ){ const el = document.getElementById('q-'+openQ); if (el && !el.dataset.seen){ const r = el.getBoundingClientRect(); if (r.top<0||r.top>innerHeight-100) el.scrollIntoView({block:'start'}); } }
}

// Shared by question cards and the exam: drafts save without re-rendering (keeps focus), checkboxes update the score in place.
function bindWriting(){
  document.querySelectorAll('[data-draft]').forEach(t => t.oninput = () => {
    S.draft[t.dataset.draft] = t.value; save();
    const w = document.querySelector(`[data-wc="${t.dataset.draft}"]`); if (w) w.textContent = wc(t.value);
  });
  document.querySelectorAll('[data-ck]').forEach(b => b.onchange = () => {
    chk(b.dataset.ck)[+b.dataset.k] = b.checked; save();
    const box = b.closest('.checklist'), all = box.querySelectorAll('input'), n = [...all].filter(x=>x.checked).length;
    box.querySelector('.cl-score').textContent = n+'/'+all.length;
  });
}

/* ---------- FLASHCARDS ---------- */
let deck = null, deckLec = 'all', deckOnlyNew = false, flipped = false;
function makeDeck(){
  let idx = D.cards.map((c,i)=>i).filter(i => deckLec==='all' || D.cards[i][0]===+deckLec);
  if (deckOnlyNew) idx = idx.filter(i => !S.known[i]);
  deck = { order: shuffle(idx), pos: 0 }; flipped = false;
}
function viewCards(){
  if (!deck) makeDeck();
  const total = deck.order.length, i = deck.order[deck.pos], c = D.cards[i];
  const sel = `<select id="dlec"><option value="all">Բոլոր դասախոսությունները</option>${D.lectures.map(l=>`<option value="${l.id}" ${deckLec==l.id?'selected':''}>Դասախոսություն ${l.id}</option>`).join('')}</select>`;
  const known = D.cards.filter((c,k)=>S.known[k] && (deckLec==='all'||c[0]===+deckLec)).length;
  const scope = D.cards.filter(c=>deckLec==='all'||c[0]===+deckLec).length;
  return `<div class="view">
    <header class="view-head"><span class="eyebrow">${scope} քարտ · սովորած ${known}</span><h1>Քարտեր</h1>
    <p class="lede">Տերմին → սահմանում։ Սեղմեք քարտին կամ Space՝ շրջելու համար, ← «Կրկնել», → «Գիտեմ»։</p></header>
    <div class="row">${sel}<label class="row" style="gap:6px;font-size:14px"><input type="checkbox" id="donly" ${deckOnlyNew?'checked':''}> Միայն չսովորածները</label><button class="btn small" id="dshuf">Խառնել</button></div>
    ${total ? `<div class="deck">
      <div class="progress"><i style="width:${100*deck.pos/total}%"></i></div>
      <button class="card ${flipped?'flipped':''}" id="card" aria-label="Շրջել քարտը"><div class="card-in">
        <div class="face"><small>ԴԱՍ. ${c[0]} · ${deck.pos+1}/${total}</small><div class="term">${esc(c[1])}</div><span class="hint">Սեղմեք՝ շրջելու համար</span></div>
        <div class="face back"><small>${S.known[i]?'✓ ՍՈՎՈՐԱԾ':'ՍԱՀՄԱՆՈՒՄ'}</small><div class="def">${esc(c[2])}</div></div>
      </div></button>
      <div class="deck-ctrl"><button class="btn" id="dprev" ${deck.pos?'':'disabled'}>← Նախորդ</button><button class="btn" id="dagain">Կրկնել</button><button class="btn primary" id="dknow">Գիտեմ</button></div>
    </div>` : `<div class="panel">Այս խմբում բոլոր քարտերը սովորած են։ Հանեք «Միայն չսովորածները» նշումը՝ կրկնելու համար։</div>`}
  </div>`;
}
function cardNext(knew){
  const i = deck.order[deck.pos];
  if (knew) S.known[i] = true; else { delete S.known[i]; deck.order.push(i); }
  save(); deck.pos++; flipped = false;
  if (deck.pos >= deck.order.length){ makeDeck(); }
  render();
}
function bindCards(){
  $('#dlec').onchange = e => { deckLec = e.target.value; makeDeck(); render(); };
  $('#donly').onchange = e => { deckOnlyNew = e.target.checked; makeDeck(); render(); };
  $('#dshuf').onclick = () => { makeDeck(); render(); };
  const card = $('#card'); if (!card) return;
  card.onclick = () => { flipped = !flipped; card.classList.toggle('flipped', flipped); };
  $('#dknow').onclick = () => cardNext(true);
  $('#dagain').onclick = () => cardNext(false);
  $('#dprev').onclick = () => { deck.pos = Math.max(0,deck.pos-1); flipped=false; render(); };
}
document.addEventListener('keydown', e => {
  if (route !== 'cards' || !$('#card') || e.target.matches('input,select,textarea')) return;
  if (e.key===' '){ e.preventDefault(); $('#card').click(); }
  if (e.key==='ArrowRight') cardNext(true);
  if (e.key==='ArrowLeft') cardNext(false);
});

/* ---------- QUIZ ---------- */
let quiz = null; const quizCfg = { lec:'all', n:15 };
function startQuiz(){
  let pool = D.quiz.map((q,i)=>i).filter(i => quizCfg.lec==='all' || D.quiz[i][0]===+quizCfg.lec);
  pool = shuffle(pool).slice(0, quizCfg.n==='all' ? pool.length : +quizCfg.n);
  quiz = { items: pool.map(i => ({ i, opts: shuffle(D.quiz[i][2].map((t,k)=>({t,ok:k===0}))), pick:null })), pos:0, done:false };
}
function viewQuiz(){
  const head = `<header class="view-head"><span class="eyebrow">${D.quiz.length} հարց բանկում</span><h1>Թեստ</h1></header>`;
  if (!quiz){
    const hist = S.quiz.slice(-10);
    return `<div class="view">${head}
      <div class="panel" style="display:flex;flex-direction:column;gap:16px">
        <div class="row"><label for="zlec" style="min-width:110px">Դասախոսություն</label><select id="zlec"><option value="all">Բոլորը (1–7)</option>${D.lectures.map(l=>`<option value="${l.id}" ${quizCfg.lec==l.id?'selected':''}>${l.id}. ${l.title}</option>`).join('')}</select></div>
        <div class="row"><label for="zn" style="min-width:110px">Հարցերի թիվ</label><select id="zn">${[10,15,25,'all'].map(n=>`<option value="${n}" ${quizCfg.n==n?'selected':''}>${n==='all'?'Բոլորը':n}</option>`).join('')}</select></div>
        <div><button class="btn primary" id="zstart">Սկսել թեստը</button></div>
      </div>
      ${hist.length ? `<section class="panel"><h2 style="font-size:17px;margin-bottom:10px">Վերջին արդյունքները</h2><div class="row" style="align-items:flex-end;gap:16px"><div class="hist">${hist.map(r=>`<i style="height:${Math.max(4,60*r.s/r.n)}px" title="${r.s}/${r.n} · ${r.l==='all'?'բոլորը':'դաս. '+r.l}"></i>`).join('')}</div><span class="note">${hist.map(r=>Math.round(100*r.s/r.n)+'%').join(' · ')}</span></div></section>`:''}
    </div>`;
  }
  if (quiz.done){
    const s = quiz.items.filter(x=>x.pick!==null && x.opts[x.pick].ok).length, n = quiz.items.length;
    const wrong = quiz.items.filter(x=>!x.opts[x.pick].ok);
    return `<div class="view">${head}
      <div class="panel row" style="gap:24px"><span class="score">${Math.round(100*s/n)}%</span><div><b>${s} ճիշտ ${n}-ից</b><br><span class="note">${s===n?'Կատարյալ է։':wrong.length+' սխալ․ դրանք ներքևում են՝ ճիշտ պատասխաններով։'}</span></div></div>
      ${wrong.length?`<section class="mist"><h2 style="font-size:18px">Սխալներ</h2>${wrong.map(x=>{const Q=D.quiz[x.i];return `<div><b>${esc(Q[1])}</b><br>Ձեր պատասխանը՝ ${esc(x.opts[x.pick].t)}<br>Ճիշտ է՝ <b>${esc(Q[2][0])}</b><br><span class="note">${esc(Q[3])} (Դաս. ${Q[0]})</span></div>`;}).join('')}</section>`:''}
      <div class="row"><button class="btn primary" id="zagain">Նոր թեստ</button><button class="btn" id="zsetup">Փոխել կարգավորումները</button></div></div>`;
  }
  const it = quiz.items[quiz.pos], Q = D.quiz[it.i], ans = it.pick!==null;
  return `<div class="view">${head}
    <div class="qz-top"><span>Հարց ${quiz.pos+1} / ${quiz.items.length} · Դաս. ${Q[0]}</span><span>${quiz.items.filter(x=>x.pick!==null&&x.opts[x.pick].ok).length} ճիշտ</span></div>
    <div class="progress" style="max-width:none"><i style="width:${100*quiz.pos/quiz.items.length}%"></i></div>
    <p class="qz-q">${esc(Q[1])}</p>
    <div class="qz-opts">${it.opts.map((o,k)=>`<button class="opt ${ans&&o.ok?'ok':''} ${ans&&it.pick===k&&!o.ok?'no':''}" data-pick="${k}" ${ans?'disabled':''}><span class="k">${'ԱԲԳԴ'[k]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>

  </div>`;

function bindQuiz(){
  if ($('#zstart')){ $('#zlec').onchange=e=>quizCfg.lec=e.target.value; $('#zn').onchange=e=>quizCfg.n=e.target.value; $('#zstart').onclick=()=>{startQuiz();render();}; }
  document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { quiz.items[quiz.pos].pick = +b.dataset.pick; render(); });
  const nx = $('#znext'); if (nx) nx.onclick = () => {
    if (quiz.pos+1 < quiz.items.length){ quiz.pos++; } else {
      quiz.done = true; const s = quiz.items.filter(x=>x.opts[x.pick].ok).length;
      S.quiz.push({s, n:quiz.items.length, l:quizCfg.lec, t:Date.now()}); S.quiz = S.quiz.slice(-30); save();
    } render(); window.scrollTo(0,0); };
  if ($('#zagain')){ $('#zagain').onclick=()=>{startQuiz();render();}; $('#zsetup').onclick=()=>{quiz=null;render();}; }
}
document.addEventListener('keydown', e => {
  if (route!=='quiz' || !quiz || quiz.done || e.target.matches('input,select,textarea')) return;
  const k = ['1','2','3','4'].indexOf(e.key); const it = quiz.items[quiz.pos];
  if (k>=0 && it.pick===null && k<it.opts.length){ it.pick=k; render(); }
  else if (e.key==='Enter' && it.pick!==null) $('#znext')?.click();
});

/* ---------- EXAM ---------- */
let exam = null, tick = null;
function startExam(mins){
  const themes = shuffle([1,2,3,4]).slice(0,3).sort();
  exam = { qs: themes.map(t => shuffle(D.questions.filter(q=>q.t===t))[0].id), end: mins ? Date.now()+mins*60000 : null, done:false, txt:{} };
}
const fmt = ms => { const s=Math.max(0,Math.round(ms/1000)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
function viewExam(){
  const head = `<header class="view-head"><span class="eyebrow">Տոմս՝ 3 հարց տարբեր թեմաներից</span><h1>Քննության փորձ</h1>`;
  if (!exam) return `<div class="view">${head}<p class="lede">Ինչպես իսկական քննությունում․ 3 պատահական հարց երեք տարբեր թեմաներից, ժամաչափով։ Գրեք պատասխանները առանց նյութին նայելու։ Ավարտելուց հետո ստուգեք յուրաքանչյուրը հիմնական կետերի ցանկով, կարդացեք ամբողջական պատասխանը և գնահատեք ձեզ։ Գնահատականը կերևա «Գրավոր հարցեր» բաժնում։</p></header>
    <div class="panel row"><span>Ժամանակ՝</span><button class="btn primary" data-ex="45">45 րոպե</button><button class="btn" data-ex="30">30 րոպե</button><button class="btn" data-ex="0">Առանց ժամաչափի</button></div></div>`;
  const qs = exam.qs.map(id => D.questions.find(q=>q.id===id));
  return `<div class="view">${head}</header>
    <div class="row" style="justify-content:space-between">${exam.end&&!exam.done?`<span class="timer" id="timer">${fmt(exam.end-Date.now())}</span>`:'<span></span>'}
      ${exam.done?`<button class="btn" id="exnew">Նոր տոմս</button>`:`<button class="btn primary" id="exend">Ավարտել և ստուգել</button>`}</div>
    ${qs.map((q,k)=>`<div class="ticket"><span class="q-id">Հարց ${k+1} · ${q.id} · Թեմա ${q.t}</span><h3>${esc(q.q)}</h3>
      ${exam.done ? `${exam.txt[q.id]?`<div class="panel" style="white-space:pre-wrap;font-size:14.5px"><span class="eyebrow">Ձեր պատասխանը</span><br>${esc(exam.txt[q.id])}</div>`:''}
        ${checklist(q)}${fullAnswer(q)}${rateRow(q)}`
      : `<textarea id="ex-${k}" data-ext="${q.id}" placeholder="Գրեք պատասխանը այստեղ․ սահմանում, բացատրություն, բանաձև/սխեմա, թվեր…">${esc(exam.txt[q.id]||'')}</textarea>`}</div>`).join('')}
  </div>`;
}
function bindExam(){
  clearInterval(tick);
  document.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => { startExam(+b.dataset.ex); render(); });
  document.querySelectorAll('[data-ext]').forEach(t => t.oninput = () => exam.txt[t.dataset.ext] = t.value);
  const fin = () => { exam.done = true; clearInterval(tick); render(); window.scrollTo(0,0); };
  if ($('#exend')) $('#exend').onclick = fin;
  if ($('#exnew')) $('#exnew').onclick = () => { exam = null; render(); };
  document.querySelectorAll('.ticket [data-rq]').forEach(b => b.onclick = () => { S.rate[b.dataset.rq] = +b.dataset.r; save(); render(); });
  bindWriting();
  if (exam && exam.end && !exam.done){
    tick = setInterval(() => { const el = $('#timer'); if (!el) return clearInterval(tick); const left = exam.end-Date.now(); el.textContent = fmt(left); el.classList.toggle('low', left<5*60000); if (left<=0) fin(); }, 1000);
  }
}

const LBL = [['Հ',3.4,1450],['Հ + Ա',1.6,1330],['Հ + ՑI',5.6,1320],['Ա',0.55,1050],['Ա + ՑII',1.45,920],['Ա + ՑII + Լ',3.2,920],['Լ + ՑI',5.5,920],['Ֆ + Պ',0.42,380],['Պ + ՑII',1.47,380],['Պ + ՑII + Լ′',3.2,380],['Լ′ + ՑI',5.5,380]];
function pip(pt, poly){ let ins=false; for (let i=0,j=poly.length-1;i<poly.length;j=i++){ const [xi,yi]=poly[i],[xj,yj]=poly[j]; if (((yi>pt[1])!==(yj>pt[1])) && (pt[0] < (xj-xi)*(pt[1]-yi)/(yj-yi)+xi)) ins=!ins; } return ins; }
function classify(c){
  if (c < 0.02) return 'Տեխնիկական երկաթ';
  if (Math.abs(c-0.8) < 0.03) return 'Էվտեկտոիդային պողպատ';
  if (c < 0.8) return 'Մինչէվտեկտոիդային պողպատ';
  if (c <= 2.14) return 'Հետէվտեկտոիդային պողպատ';
  if (Math.abs(c-4.3) < 0.05) return 'Էվտեկտիկական չուգուն';
  if (c < 4.3) return 'Մինչէվտեկտիկական չուգուն';
  return 'Հետէվտեկտիկական չուգուն';
}
let dgPt = [0.4, 500];
function viewDiagram(){
  const poly = pts => pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');
  const line = (...ks) => `<polyline class="ln" points="${poly(ks.map(k=>typeof k==='string'?P[k]:k))}"/>`;
  const yt = [0,200,400,600,727,800,910,1000,1147,1200,1400,1539,1600], xt=[0,0.8,2.14,3,4.3,5,6,6.67];
  const svg = `<svg class="dg" id="dg" viewBox="0 0 770 520" role="img" aria-label="Fe–Fe₃C վիճակի դիագրամ">
    ${yt.map(t=>`<line class="grid" x1="${DX0}" x2="${DX1}" y1="${Y(t)}" y2="${Y(t)}"/><text class="axis" x="${DX0-8}" y="${Y(t)+4}" text-anchor="end">${t}</text>`).join('')}
    ${xt.map(c=>`<text class="axis" x="${X(c)}" y="${DY1+18}" text-anchor="middle">${String(c).replace('.',',')}</text>`).join('')}
    <text class="axis" x="${DX0-8}" y="${DY0-8}" text-anchor="end">°C</text><text class="axis" x="${DX1}" y="${DY1+36}" text-anchor="end">C, % ըստ զանգվածի</text>
    ${REG.map(r=>`<polygon class="reg" data-reg="${r[0]}" points="${poly(r[1])}"/>`).join('')}
    <line class="ln thin" x1="${X(0.8)}" x2="${X(0.8)}" y1="${Y(727)}" y2="${DY1}"/><line class="ln thin" x1="${X(2.14)}" x2="${X(2.14)}" y1="${Y(1147)}" y2="${DY1}"/><line class="ln thin" x1="${X(4.3)}" x2="${X(4.3)}" y1="${Y(1147)}" y2="${DY1}"/>
    <line class="ln thin" x1="${X(0)}" x2="${X(0.55)}" y1="${Y(769)}" y2="${Y(769)}"/><text class="axis" x="${X(0.58)}" y="${Y(769)+4}">769 (A₂)</text>
    ${line('A','B','C','D')}${line('A','H','J','B')}${line('N','H')}${line('N','J')}${line('J','E')}${line('E','C','F')}${line('G','S','E')}${line('G','P','Q')}${line('P','S','K')}
    <line class="ln" x1="${X(6.67)}" x2="${X(6.67)}" y1="${Y(1600)}" y2="${DY1}"/><line class="ln" x1="${DX0}" x2="${DX0}" y1="${DY0}" y2="${DY1}"/><line class="ln" x1="${DX0}" x2="${DX1}" y1="${DY1}" y2="${DY1}"/>
    ${Object.entries({A:[-14,-4],B:[4,-6],H:[-4,-8],J:[4,10],N:[-14,4],C:[0,16],D:[-14,0],E:[-4,16],F:[6,4],G:[-14,4],S:[0,16],P:[4,14],K:[6,4],Q:[6,-6]}).map(([k,[dx,dy]])=>`<text class="pt" x="${X(P[k][0])+dx}" y="${Y(P[k][1])+dy}">${k}</text>`).join('')}
    ${LBL.map(([t,c,T])=>`<text class="lbl" x="${X(c)}" y="${Y(T)}" text-anchor="middle">${t}</text>`).join('')}
    <g id="mk"><line class="mkl" id="mkx"/><line class="mkl" id="mky"/><circle class="mk" id="mkc" r="6"/></g>
  </svg>`;
  return `<div class="view">
    <header class="view-head"><span class="eyebrow">Թեմա 3.5 · Դասախոսություն 6</span><h1>Fe–Fe₃C վիճակի դիագրամ</h1>
    <p class="lede">Սեղմեք դիագրամի ցանկացած կետին կամ շարժեք սահիչները․ կտեսնեք տիրույթը, ֆազերը, ստրուկտուրան և համաձուլվածքի դասը։ Վերին ձախ փոքր տիրույթների համար օգտվեք սահիչներից։</p></header>
    <div class="dg-wrap">${svg}</div>
    <div class="dg-ctrl">
      <label for="dgc">Ածխածին՝ <b class="mono" id="dgcv"></b><input type="range" id="dgc" min="0" max="6.67" step="0.01" value="${dgPt[0]}"></label>
      <label for="dgt">Ջերմաստիճան՝ <b class="mono" id="dgtv"></b><input type="range" id="dgt" min="0" max="1650" step="1" value="${dgPt[1]}"></label>
    </div>
    <div class="panel dg-info" id="dginfo"></div>
    <section class="panel prose" style="max-width:none"><h2 style="font-size:18px;margin-bottom:8px">Երեք հորիզոնական գծեր</h2>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Գիծ</th><th>T</th><th>Ռեակցիա</th><th>Արդյունք</th></tr></thead><tbody>
      <tr><td>HJB</td><td class="mono">1493°C</td><td>Հ₀,₅₁ + Ֆδ₀,₁ → Ա₀,₁₆</td><td>պերիտեկտիկա</td></tr>
      <tr><td>ECF</td><td class="mono">1147°C</td><td>Հ₄,₃ → Ա₂,₁₄ + Ց₆,₆₇</td><td>էվտեկտիկա՝ լեդեբուրիտ</td></tr>
      <tr><td>PSK</td><td class="mono">727°C</td><td>Ա₀,₈ → Ֆ₀,₀₂ + Ց₆,₆₇</td><td>էվտեկտոիդ՝ պեռլիտ</td></tr></tbody></table></div></section>
  </div>`;
}
function dgUpdate(){
  const [c,t] = dgPt, r = REG.find(r => pip([c,t], r[1]));
  $('#dgcv').textContent = c.toFixed(2).replace('.',',')+'%'; $('#dgtv').textContent = Math.round(t)+'°C';
  const cx=X(c), cy=Y(t);
  $('#mkc').setAttribute('cx',cx); $('#mkc').setAttribute('cy',cy);
  Object.entries({x1:DX0,x2:cx,y1:cy,y2:cy}).forEach(([k,v])=>$('#mkx').setAttribute(k,v));
  Object.entries({x1:cx,x2:cx,y1:cy,y2:DY1}).forEach(([k,v])=>$('#mky').setAttribute(k,v));
  document.querySelectorAll('.reg').forEach(p => p.classList.toggle('on', r && p.dataset.reg===r[0]));
  $('#dginfo').innerHTML = r ? `<div><span class="eyebrow">Տիրույթ</span><h3>${r[2]}</h3><p style="margin:6px 0 0">${r[5]}</p></div>
    <dl class="kv"><dt>Ֆազեր</dt><dd>${r[3]}</dd><dt>Ստրուկտուրա</dt><dd>${r[4]}</dd><dt>Համաձուլվածք</dt><dd>${classify(c)}</dd><dt>Կետը</dt><dd class="mono">${c.toFixed(2).replace('.',',')}% C, ${Math.round(t)}°C</dd></dl>`
    : `<div><h3>Գծի վրա</h3><p>Կետը գտնվում է սահմանագծի վրա․ մի փոքր տեղաշարժեք այն։</p></div>`;
}
function bindDiagram(){
  const svg = $('#dg'), c=$('#dgc'), t=$('#dgt');
  svg.addEventListener('click', e => {
    const pt = svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const cc = (p.x-DX0)/(DX1-DX0)*CMAX, tt = (DY1-p.y)/(DY1-DY0)*TMAX;
    if (cc<0||cc>CMAX||tt<0||tt>TMAX) return;
    dgPt = [cc,tt]; c.value=cc; t.value=tt; dgUpdate();
  });
  c.oninput = () => { dgPt[0] = +c.value; dgUpdate(); };
  t.oninput = () => { dgPt[1] = +t.value; dgUpdate(); };
  dgUpdate();
}

/* ---------- router ---------- */
let route = 'home';
const V = { home:[viewHome,()=>{}], lectures:[viewLectures,bindLectures], questions:[viewQuestions,bindQuestions], cards:[viewCards,bindCards], quiz:[viewQuiz,bindQuiz], exam:[viewExam,bindExam], diagram:[viewDiagram,bindDiagram] };
function render(){ buildNav(route); $('#main').innerHTML = V[route][0](); V[route][1](); }
function onHash(){
  const h = location.hash.slice(1);
  const prev = route; route = V[h] ? h : 'home';
  if (prev==='exam' && route!=='exam') clearInterval(tick);
  render(); if (prev!==route) window.scrollTo(0,0);
}
window.addEventListener('hashchange', onHash);
$('#reset').onclick = e => {
  const b = e.target;
  if (b.dataset.armed){ S = { read:{}, rate:{}, known:{}, quiz:[], sup:true, draft:{}, chk:{} }; save(); deck=null; quiz=null; exam=null; b.textContent='Զրոյացված է'; delete b.dataset.armed; render(); }
  else { b.dataset.armed='1'; b.textContent='Սեղմեք կրկին՝ հաստատելու համար'; setTimeout(()=>{ if(b.dataset.armed){delete b.dataset.armed; b.textContent='Զրոյացնել առաջընթացը';} },4000); }
};
onHash();
})();
